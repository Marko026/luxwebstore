# Lint and type-check every PR and push to main.
# No build here: `next build` prerenders from the database, and CI has no DATABASE_URL.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 ships npm 11, which wrote package-lock.json; npm 10 (Node 22) rejects it as out of sync
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
